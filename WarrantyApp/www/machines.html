<!DOCTYPE html>
<html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makineritë — Danfos Garanci</title>
<link rel="icon" href="assets/garanci-logo.svg"><link rel="stylesheet" href="css/tokens/colors.css"><link rel="stylesheet" href="css/tokens/typography.css"><link rel="stylesheet" href="css/tokens/spacing.css"><link rel="stylesheet" href="css/tokens/effects.css"><link rel="stylesheet" href="css/garanci.css"><link rel="stylesheet" href="css/modern.css">
<style>
.gn-page .mp-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.gn-page .mp-toolbar .dg-search{max-width:480px;flex-basis:280px}.gn-page .mp-filter{max-width:225px}.gn-page .mp-pagination{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0}.gn-page .mp-detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:20px;align-items:start}.gn-page .mp-stack{display:grid;gap:18px;min-width:0}.gn-page .mp-serial{overflow-wrap:anywhere}.gn-page .mp-card-heading{display:flex;justify-content:space-between;align-items:start;gap:14px}.gn-page .mp-history{margin:18px 0 0;padding:0;list-style:none}.gn-page .mp-history li{position:relative;border-left:1px solid var(--dg-edge);margin-left:7px;padding:0 0 24px 25px}.gn-page .mp-history li:before{content:'';position:absolute;left:-6px;top:4px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 30% 20%,#ddfff7,#65cbb8 45%,#1c5550);box-shadow:0 3px 7px #0009}.gn-page .mp-history li:last-child{padding-bottom:0;border-color:transparent}.gn-page .mp-history p{margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.gn-page .mp-history small{display:block;color:var(--dg-muted);margin-top:5px}.gn-page .mp-cert+.mp-cert{border-top:1px solid var(--dg-edge);margin-top:18px;padding-top:18px}.gn-page .mp-empty{padding:25px;line-height:1.7}.gn-page .mp-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:14px}.gn-page .mp-photos figure{margin:0;min-width:0}.gn-page .mp-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}.gn-page .mp-photos figcaption{overflow-wrap:anywhere;font-size:10px;color:var(--dg-muted);margin-top:4px}.gn-page .mp-ticket-intake{border-top:1px solid var(--dg-edge);padding-top:14px;margin-top:14px}.gn-page .mp-ticket-intake p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.gn-page .mp-alert{color:var(--dg-red);margin:18px 0}.gn-page .mp-status{color:var(--dg-muted);margin:12px 0}.gn-page .mp-detail .dg-fact b{overflow-wrap:anywhere}.gn-page .mp-certificate-note{margin-top:12px;color:var(--dg-muted);font-size:11px;line-height:1.7}
@media(max-width:960px){.gn-page .mp-detail{grid-template-columns:1fr}}@media(max-width:560px){.gn-page .mp-filter{max-width:none;width:100%}}
</style></head><body><div class="gn-page" id="app-root"><div id="header-slot"></div><main class="gn-main"><div id="machine-root" aria-busy="true"><p class="mp-status">Duke ngarkuar makineritë…</p></div><p id="machine-error" class="mp-alert" role="alert" hidden></p></main></div><script type="module" src="js/machines.js"></script></body></html>
