<!DOCTYPE html><html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planifikimi — Danfos Garanci</title><link rel="icon" href="assets/garanci-logo.svg"><link rel="stylesheet" href="css/tokens/colors.css"><link rel="stylesheet" href="css/tokens/typography.css"><link rel="stylesheet" href="css/tokens/spacing.css"><link rel="stylesheet" href="css/tokens/effects.css"><link rel="stylesheet" href="css/garanci.css"><link rel="stylesheet" href="css/modern.css">
<style>
.gn-page .sp-toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.gn-page .sp-toolbar .dg-field{margin:0;min-width:175px}.gn-page .sp-toolbar select{max-width:240px}.gn-page .sp-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:20px 0}.gn-page .sp-day{display:grid;gap:7px;padding:13px 5px;text-align:center;background:var(--dg-surface);border:1px solid var(--dg-edge);border-radius:12px}.gn-page .sp-day[aria-pressed=true]{border-color:var(--dg-accent);background:var(--dg-soft)}.gn-page .sp-day strong{font-family:var(--font-display);font-size:23px}.gn-page .sp-day small{font-size:10px;color:var(--dg-muted)}.gn-page .sp-day .sp-dots{height:5px;display:flex;justify-content:center;gap:3px}.gn-page .sp-dots i{background:var(--dg-accent);width:4px;height:4px;border-radius:50%}.gn-page .sp-columns{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}.gn-page .sp-stack{display:grid;gap:18px}.gn-page .sp-empty{padding:18px;color:var(--dg-muted);line-height:1.7}.gn-page .sp-info{font-size:11px;color:var(--dg-muted);line-height:1.7;margin:10px 0}.gn-page .sp-part{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:15px 18px;border-top:1px solid var(--dg-edge)}.gn-page .sp-part p{margin-top:4px;font-size:11px;color:var(--dg-muted)}.gn-page .sp-part small{color:var(--dg-gold)}.gn-page .sp-error{color:var(--dg-red);margin-top:15px}.gn-page .dg-schedule-row h3,.gn-page .sp-part{overflow-wrap:anywhere}.gn-page .sp-inline{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.gn-page .sp-unscheduled{display:block;border-top:1px solid var(--dg-edge);padding:15px 18px;color:inherit;text-decoration:none}.gn-page .sp-unscheduled:hover{background:#1b2030}.gn-page .sp-unscheduled p{color:var(--dg-muted);font-size:11px;margin:4px 0}.gn-page .sp-today{color:var(--dg-cyan)}
@media(max-width:1080px){.gn-page .sp-columns{grid-template-columns:1fr}}@media(max-width:560px){.gn-page .sp-week{gap:4px}.gn-page .sp-day small{font-size:8px}.gn-page .sp-day strong{font-size:19px}}
</style></head><body><div id="app-root" class="gn-page"><div id="header-slot"></div><main class="gn-main"><div class="dg-heading"><div><div class="dg-eyebrow">PLANIFIKIMI I SERVISIT</div><h1 style="margin-top:10px">Dita e servisit.</h1><p>Takimet, afatet dhe gatishmëria e pjesëve.</p></div><a class="dg-button dg-primary" href="pending.html">Hap bordin e servisit ↗</a></div><div class="sp-toolbar"><label class="dg-field">Dita<input class="gn-input" id="schedule-date" type="date"></label><button class="dg-button" id="schedule-today" type="button">Sot</button><label class="dg-field">Tekniku<select class="gn-input" id="schedule-tech"><option value="all">Të gjithë teknikët</option></select></label><label class="dg-small dg-muted" style="display:flex;align-items:center;gap:7px;padding-bottom:8px"><input id="schedule-closed" type="checkbox">Përfshi të përfunduarat</label></div><div id="schedule-week" class="sp-week" aria-label="Java e zgjedhur"></div><p id="schedule-loading" class="sp-info" role="status">Duke ngarkuar takimet…</p><div id="schedule-root" aria-busy="true"></div><p id="schedule-error" class="sp-error" role="alert" hidden></p></main></div><script type="module" src="js/schedule.js"></script></body></html>
